name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 构建 + 单测
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # runner 自带 Android SDK（ubuntu-latest 预装 platforms/build-tools），不引入
      # setup-android 动作：它每次要重下 cmdline-tools，失败面大且非必需。
      # 这里只补齐缺失组件，缺了就在下面 ls 校验处硬失败（错误信息直指缺哪个）。
      - name: 准备 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::未找到 sdkmanager，依赖 runner 预装 SDK"
          else
            yes | timeout 120 "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            timeout 600 "$SDKMANAGER" "platforms;android-35" "build-tools;36.0.0" >/dev/null 2>&1 \
              || echo "::warning::sdkmanager 安装组件失败，改用 runner 预装版本"
          fi
          ls -d "$ANDROID_HOME"/platforms/android-35 >/dev/null
          ls -d "$ANDROID_HOME"/build-tools/36.0.0 >/dev/null

      - name: 构建三模块 + 单元测试
        run: ./gradlew --console=plain :contract:assembleRelease :plugin-core:assembleRelease :sample-dummy-plugin:assembleDebug test

      - name: 归档产物
        uses: actions/upload-artifact@v4
        with:
          name: goodhub-mcp-sdk
          path: |
            contract/build/outputs/aar/*.aar
            plugin-core/build/outputs/aar/*.aar
            sample-dummy-plugin/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  publish:
    name: 发布到 GitHub Packages
    needs: build
    # 仅 tag 触发（版本唯一性：GitHub Packages 不允许重发同版本号）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # runner 自带 Android SDK（ubuntu-latest 预装 platforms/build-tools），不引入
      # setup-android 动作：它每次要重下 cmdline-tools，失败面大且非必需。
      # 这里只补齐缺失组件，缺了就在下面 ls 校验处硬失败（错误信息直指缺哪个）。
      - name: 准备 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::未找到 sdkmanager，依赖 runner 预装 SDK"
          else
            yes | timeout 120 "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            timeout 600 "$SDKMANAGER" "platforms;android-35" "build-tools;36.0.0" >/dev/null 2>&1 \
              || echo "::warning::sdkmanager 安装组件失败，改用 runner 预装版本"
          fi
          ls -d "$ANDROID_HOME"/platforms/android-35 >/dev/null
          ls -d "$ANDROID_HOME"/build-tools/36.0.0 >/dev/null

      - name: 校验 tag 版本与 VERSION 文件一致
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          FILE_VER=$(grep '^version=' VERSION | cut -d= -f2)
          if [ "$TAG_VER" != "$FILE_VER" ]; then
            echo "::error::tag 版本 $TAG_VER 与 VERSION 文件 $FILE_VER 不一致，先改 VERSION 再打 tag"
            exit 1
          fi

      - name: 发布 AAR 到 GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: >-
          ./gradlew --console=plain
          :contract:publishReleasePublicationToGitHubPackagesRepository
          :plugin-core:publishReleasePublicationToGitHubPackagesRepository
